<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research Survey</title>
<style>
:root{--navy:#0b1f3a;--blue:#1f5fbf;--blue2:#e8f0fc;--gold:#b8892b;--bg:#f4f6fa;--line:#d4dbe8;--text:#14213a;--mute:#5b6b85;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45;background:var(--bg);color:var(--text)}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header.top .brand{font-weight:bold;color:var(--navy);letter-spacing:.02em}
header.top .brand b{color:var(--gold)}
.bar{height:4px;background:#e3e9f4}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.pv{background:#fff4d6;color:#6b4a00;text-align:center;font-size:13px;padding:6px 10px;border-bottom:1px solid #ecd9a3}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.pre{color:var(--mute);margin:0 0 14px}
.stem{font-size:18px;line-height:1.4;margin:0 0 12px;font-weight:bold}
.sub{margin:6px 0 2px;font-weight:bold}
.defn{background:var(--blue2);border-left:4px solid var(--blue);padding:10px 12px;margin:10px 0;border-radius:4px}
.instr,.note{color:var(--mute);margin:8px 0}
.legend{margin:8px 0 12px;padding:8px 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:6px;font-size:14px}
.legend div{margin:2px 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin:7px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--blue)}
.opt.on{background:var(--blue2);border-color:var(--blue)}
.opt.dis{opacity:.45;cursor:default}
.scroll{overflow-x:auto;margin:10px 0}
table.g{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
table.g th{background:var(--navy);color:#fff;padding:8px 6px;font-weight:bold;text-align:center;vertical-align:bottom}
table.g th.l{text-align:left}
table.g.tg{min-width:0}
table.g.tg th,table.g.tg td{padding-left:3px;padding-right:3px}
table.g.tg td.l,table.g.tg th.l{padding-left:8px}
table.g td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center}
table.g td.l{text-align:left;padding-left:8px}
table.g tr:nth-child(even) td{background:#f8fafd}
table.g input{width:19px;height:19px;accent-color:var(--blue)}
.hd{font-size:12px;color:var(--mute);font-weight:bold;letter-spacing:.04em;margin-top:10px}
.def{position:relative;border-bottom:1px dotted var(--blue);cursor:help}
.def .tip{display:none;position:absolute;left:0;top:100%;z-index:5;width:min(420px,80vw);background:#fff;border:1px solid var(--blue);border-radius:6px;padding:10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-weight:normal;text-align:left}
.def:hover .tip,.def:focus .tip,.def.open .tip{display:block}
.scale7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.scale7 label{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 4px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;background:#fff}
.scale7 label.on{background:var(--blue2);border-color:var(--blue)}
.scale7 b{font-size:18px;color:var(--navy)}
.scale7 input{position:absolute;opacity:0;pointer-events:none}
.slw{margin:18px 0}.sl{width:100%;accent-color:var(--blue)}
.sl{height:40px;cursor:pointer;margin:0}.sl.untouched{-webkit-appearance:none;appearance:none;background:linear-gradient(#d8dee9,#d8dee9) center/100% 6px no-repeat;outline-offset:2px}
.sl.untouched::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;opacity:0}.sl.untouched::-moz-range-thumb{width:22px;height:22px;opacity:0;border:0}.sl.untouched::-moz-range-track{background:#d8dee9;height:6px}
.ticks{display:flex;margin-top:8px}.ticks .tk{flex:1;text-align:center;padding:0 2px;font-size:12px;color:var(--mute)}.ticks .tk b{display:block;font-size:15px;color:var(--navy)}
.slcap{margin:12px 0;font-weight:bold;min-height:22px}
@media(max-width:640px){.ticks .tk{font-size:10px}}
.fac{font-weight:bold;font-size:18px;margin:6px 0 2px}.facd{color:var(--mute);margin:0 0 6px}
.cs{display:flex;gap:10px;align-items:center;margin:8px 0}
.cs input{width:84px;padding:8px;font-size:16px;border:1px solid var(--line);border-radius:6px;text-align:right}
.cs span.pts{color:var(--mute);width:42px}
.tot{margin-top:12px;font-weight:bold;padding:10px 12px;border-radius:8px;background:#f7f9fc;border:1px solid var(--line)}
.tot.ok{background:#e7f6ee;border-color:#9fd3b5}.tot.bad{background:#fdeceb;border-color:#f0b4b0}
.txt{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:15px;margin-top:6px}
.err{color:var(--bad);margin:12px 0 0;font-weight:bold;min-height:1.2em}
.nav{display:flex;justify-content:flex-end;margin-top:14px}
button.next{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 28px;font-size:16px;cursor:pointer}
button.next:disabled{opacity:.5}
.center{text-align:center;padding:40px 10px}
.center h1{font-size:22px;color:var(--navy)}
.lnk{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:14px;padding:0;margin:4px 0}
@media(max-width:640px){.scale7{grid-template-columns:1fr}.scale7 label{flex-direction:row;justify-content:flex-start;text-align:left}.card{padding:16px 14px}}
</style>
</head>
<body>

<div class="bar"><i id="pb"></i></div>
<div id="pvb" class="pv" style="display:none">Preview mode: answers are not saved and the link is not locked.</div>
<main><div class="card" id="box"></div></main>
<script>
// Questionnaire spec.
// Option format: [code, text, flags]  flags: T=terminate, X=exclusive, O=other-specify, F=fixed position (not randomized)
const IMP7 = [[7,'Critical to our success'],[6,'Extremely important'],[5,'Very important'],[4,'Moderately important'],[3,'Somewhat important'],[2,'Slightly important'],[1,'Not relevant to our organization']];
const TIME_COLS = ['NOW','IN 1 YEAR','IN 3 YEARS'];
const WORKLOADS = ['Data lake(s)','Data warehouse','AI Tuning & Inferencing','Hybrid Transactional Analytical Processing (HTAP)','Online Transaction Processing (OLTP)'];
const WL_DEFS = [
 'A data lake is a repository designed to store large volumes of structured, semi-structured, and unstructured data, often in its original or raw format. The data can then be used for analytics, data science, machine learning, and other processing workloads.',
 'A data warehouse is a data management environment designed primarily for querying, reporting, business intelligence, and analytics. It typically consolidates structured data from multiple sources and often maintains historical data for analysis over time.',
 'AI Tuning & Inferencing refers to the ability to optimize, deploy, and run AI models and agents using data managed within a database platform, enabling efficient model performance, real-time predictions and agentic AI interactions and decision making by the agents.',
 'Hybrid Transactional/Analytical Processing (HTAP) is an architecture that supports both online transaction processing (OLTP) and analytical processing (OLAP) within the same system or closely integrated environment, enabling analysis of operational data with less need to move it into a separate analytical system.',
 'Online Transaction Processing (OLTP) supports the high-volume, concurrent processing of operational transactions, such as purchases, orders, payments, reservations, account updates, or other real-time application activity. OLTP systems are optimized for fast, reliable inserts, updates, and retrieval of relatively small amounts of data per transaction.'
];
const CAPS = [
 {key:'MMD',title:'Multi Model Data Services',
  def:'A multi model data set of services that enable data to be pulled from a range of data engines for example from Oracle to Postgres or from transactional, analytic and/or AI data sets.',
  def214:'A multi model data set of services that enable data to be pulled from a range of data engines for example from Oracle to Postgres or from transactional, analytic and/or AI data sets.',
  items:['Integrated transactional data and enterprise database capabilities','Distributed High Availability — Resilient, highly available data services','Real-time analytical processing','Analytical data warehousing','Vector-based similarity search for AI']},
 {key:'GOV',title:'Governance Services',
  def:'A governance set of services embedded as a real time enforcement especially as agents are working. It also includes TDE keys and audit trails.',
  def214:'A governance set of services embedded as a real time enforcement especially as agents are working. It also includes TDE keys and audit trails.',
  items:['Real-time policy — Enforce policies as data and AI agents operate','Lineage — Track the origins and movement of data','Purpose-based agent access — Control agent access based on intended use','Audit — Record activity for accountability and compliance','TDE with customer-held keys — Protect encrypted data with organization-controlled keys']},
 {key:'ART',title:'Agent Runtime Services',
  def:'Agent runtimes services that enable agents to work in a sandbox with semantic search, model serving and pipelines.',
  def214:'Agent runtimes that enable agents to work in a sandbox with semantic search, model serving and pipelines.',
  items:['Agent sandbox — Provide isolated environments for agent execution','Memory — Maintain context and relevant information for agents','Semantic search — Retrieve information based on meaning','RAG pipelines — Ground AI responses in enterprise data','Model serving (GPU) — Deploy and execute AI models using GPU infrastructure']},
 {key:'SCP',title:'Sovereign Control Plane',
  def:'A sovereign control plane that enables you to forward deploy across your data estates with observability and provisioning where, when and how you need it (cloud, on premise or combinations).',
  def214:'A sovereign control plane that enables you to forward deploy across your data estates with observability and provisioning where, when and how you need it (cloud, on premise or combinations).',
  items:['Forward-deployable — Deploy services where required','Provisioning and lifecycle — Set up, update, and manage services','Backup, HA, DR — Support backup, high availability, and disaster recovery','Observability — Monitor service performance and operations','Multi-location federation — Coordinate services across locations','Air-gap image mirroring — Support deployment in isolated environments']}
];
const COUNTRIES = {US:'United States',UK:'UK',FR:'France',DE:'Germany',IT:'Italy',ES:'Spain',DK:'Denmark',NO:'Norway',SE:'Sweden',JP:'Japan',KR:'South Korea',AU:'Australia',IN:'India',SD:'Saudi/Dubai'};
const COUNTRY_CODES = {US:1,UK:2,FR:3,DE:4,IT:5,ES:6,DK:7,NO:8,SE:9,JP:10,KR:11,AU:12,IN:13,SD:14};

const SPEC = {
 s1:{id:'S1',pre:'Please tell us a bit about the organization you work for.',
  stem:'Approximately how many employees does your organization have worldwide? Your best estimate is fine. Select one.',
  opts:[[1,'Less than 250','T'],[2,'250 to 499','T'],[3,'500 to 999'],[4,'1,000 to 2,499'],[5,'2,500 to 4,999'],[6,'5,000 or more']]},
 s2:{id:'S2',stem:'In which industry does your organization mainly operate? Select one.',
  opts:[[1,'Aerospace/Defense','T'],[2,'Advertising/Marketing/Market Research','T'],[3,'Automotive'],[4,'Banking/Financial Services'],[5,'Construction','T'],[6,'Education/Training','T'],[7,'Energy Production/Utilities, Oil & Gas'],[8,'Engineering/Design','T'],[9,'Food/Beverages/Restaurants','T'],[10,'Government – Federal/State/Local','T'],[11,'Hospitality/Leisure','T'],[12,'Insurance'],[13,'Legal Services','T'],[14,'Manufacturing/Industrial'],[15,'Medical/Health Care/Pharmaceuticals'],[16,'Medical/Technology'],[17,'Non-Profit/Trade Association','T'],[18,'Real Estate','T'],[19,'Retail/Wholesale/Supply Chain','T'],[20,'Technology (hardware, software, services)'],[21,'Telecommunications/Carriers'],[22,'Transport/Logistics']],
  binf:[4,12]},
 s3:{id:'S3',pre:'Next, we’d like to learn about your role in your organization.',
  stem:'We are looking to talk to business professionals representing a wide range of job roles. Which best describes your role? Are you a…',
  opts:[[1,'President/Chairman'],[2,'CEO'],[3,'CFO/COO'],[4,'CIO/CTO/CDO'],[5,'SVP/VP'],[6,'Managing Director/Director/Senior Manager'],[7,'Head of Department, Business Unit, or Product Line'],[8,'General or Middle Management'],[9,'Accounting/Finance/Procurement','T'],[10,'Professional Staff (non-technical)','T'],[11,'Technical/IT, Data or Engineering Management'],[12,'Technical/IT, Data or Engineering Staff'],[13,'Consultant','T'],[97,'Other (please specify)','T']],
  csuite:[1,2,3,4]},
 s4:{id:'S4',stem:'Which of the following describes your functional role(s)? Please select all that apply.',
  opts:[[1,'Application/Software Development'],[2,'Cloud Infrastructure/Architecture'],[3,'Data Architecture/Infrastructure'],[4,'Data Engineering/Operations'],[5,'Data Management/Storage'],[6,'Data Analytics/Business Intelligence'],[7,'Data Science/AI/Machine Learning'],[8,'Data Strategy/Governance'],[9,'IT/Technology Operations'],[10,'DevOps/Automation'],[11,'Enterprise Architecture/Digital Transformation'],[12,'Other data-centric technology role'],[98,'None of these','XF']]},
 s5:{id:'S5',pre:'Now, please think about the software platforms your organization uses to access, manage, and analyze data across its data estate.',
  stem:'How, if at all, are you involved in selecting data infrastructure solutions? Select all that apply.',

  heads:['USE NOW','CONSIDER IN FUTURE'],
  brands:[[1,'Apache'],[2,'ClickHouse'],[3,'Databricks'],[4,'Elastic'],[5,'IBM Db2'],[6,'Loop AI'],[7,'Microsoft SQL Server'],[8,'MongoDB'],[9,'MySQL'],[10,'Oracle'],[11,'PostgreSQL'],[12,'SAP Hana'],[13,'Snowflake'],[14,'SQLite']],
  other:[15,'Other (specify)'],notsure:[99,'Not sure']},
 intro:{text:'Our survey explores how organizations are evolving AI and data strategies, including technologies, infrastructure, and governance capabilities needed to support AI adoption, maintain control and achieve measurable business value. Thank you, in advance, for your thoughts on these topics.'},
 q1:{id:'Q1',stem:'Below is a list of business functions where agentic AI may be in use. For each function, please indicate your organization’s current level of adoption within that function:',
  legend:[[5,'Scaled production/mainstream use'],[4,'Limited production'],[3,'Pilot/testing'],[2,'Exploring/planning'],[1,'No plans']],
  rows:['Cybersecurity & Fraud Detection','Predictive Analytics & Business Intelligence','Customer Engagement & Personalization','Sales & Customer Interaction','Finance & Expense Automation','Workplace Collaboration & Productivity','General Content Creation (written, audio, video)','Marketing & Campaign Optimization','Supply Chain & Operations Optimization','HR, Recruiting & Employee Development','IT Operations & DevOps','Product Design, Simulation & Prototyping (Digital Twins)','Code Generation & Software Development','Legal Document Analysis & Contract Management']},
 q201:{id:'Q201',stem:'Thinking about your organization\'s use of agentic AI in each of the following business functions, what level of positive return or impact is your organization currently realizing? Please consider both financial returns and measurable business or operational benefits. Select one response for each function.',
  legend:[[7,'Transformational positive impact'],[6,'Substantial positive impact'],[5,'Significant positive impact'],[4,'Moderate positive impact'],[3,'Modest positive impact'],[2,'Slight positive impact'],[1,'No positive impact yet']]},

  opts:[[1,'Avoid vendor lock-in – Reduce dependence on proprietary technology providers.'],[2,'Greater control – Maintain control over AI models, data, and infrastructure.'],[3,'Deployment flexibility – Run AI and data workloads across cloud, on-premises, and hybrid environments.'],[4,'Customization – Adapt technologies to specific business and technical requirements.'],[5,'Transparency and auditability – Gain visibility into underlying technology and how it operates.'],[6,'Cost optimization – Reduce licensing costs and improve long-term economics.'],[7,'Interoperability – Integrate technologies across different platforms and environments.'],[8,'Innovation and agility – Leverage community-driven development and emerging capabilities.'],[9,'Security and compliance – Independently assess and manage security and regulatory requirements.'],[98,'Open source is not part of our AI and data strategy.','XF'],[99,'Don’t know / Not sure.','XF']]},

  note:'Please use a 7-point scale, where 1 means “Not relevant to our organization” and 7 means “Critical to our success.”',
  opts:IMP7},

  items:[['Data privacy, residency & jurisdiction','Requirements governing where data is stored, accessed, and used'],['AI governance & regulatory compliance','Requirements for AI oversight, auditability, and regulatory compliance'],['Cybersecurity & intellectual property protection','Protecting organizational data, AI models, and proprietary information'],['Geopolitical uncertainty & restrictions','Government policies or geopolitical developments affecting access to AI technologies'],['Provider dependence & vendor lock-in','Reliance on AI or cloud providers and limitations on switching platforms'],['Technology portability & interoperability','Ability to move data, models, agents, and workloads between platforms'],['Business continuity & operational resilience','Maintaining AI operations despite outages or service disruptions'],['Cost of AI and Data Sovereignty','Financial resources required to maintain control over AI systems and data'],['Internal AI expertise & capabilities','Skills and resources needed to deploy and manage AI independently'],['AI infrastructure & supply-chain availability','Access to computing infrastructure, AI hardware, and critical technologies']]},

      const tot=$('div','tot'); box.appendChild(tot);
      const upd=()=>{ const s=inputs.reduce((a,i)=>a+(parseInt(i.value,10)||0),0); tot.textContent='TOTAL: '+s+' / 100 points'; tot.className='tot'+(s===100?' ok':(s>100?' bad':'')); return s; }; inputs.forEach(i=>i.oninput=upd); upd();
      return {collect:()=>{ if(inputs.some(i=>i.value.trim()===''||!/^\d+$/.test(i.value.trim()))) return {err:'Please enter a whole number of points for every item (use 0 where not important).'}; const s=upd(); if(s!==100) return {err:'The points must add up to exactly 100. Your total is '+s+'.'}; const vals={}; inputs.forEach((i,k)=>vals['Q213_'+key+'_'+(k+1)]=parseInt(i.value,10)); return {vals}; }}; }});
  });
  // Q214
  F.push({id:'Q214',mount:()=>{ const q=S.q214; box.appendChild($('p','stem',q.stem)); legendBox(q.legend); const order=shuf(CAPS.map(c=>c.key)); A.RND_Q214=order.join(',');
    const m=matrix({rows:order.map(k=>({k,label:CAPS.find(c=>c.key===k).def214})),cols:q.legend.map(l=>({v:l[0]})),name:'q214'});
    return {collect:()=>{ const g=m.get(); if(order.some(k=>g[k].length!==1)) return {err:'Please select one answer in every row to continue.'}; const vals={}; order.forEach(k=>vals['Q214_'+k]=g[k][0]); return {vals}; }}; }});
  F.push(singleNode(S.q8a));
  F.push(multiNode(S.q8b,null,{rand:true,cond:()=>A.Q8a>=2&&A.Q8a<=6}));
  F.push(singleNode(S.q8c,null,{rand:true}));
  F.push(singleNode(S.q8d)); F.push(singleNode(S.q9a));
  return F;
}

/* ---------- engine ---------- */
function setProgress(){ const vis=flow.filter(n=>!n.cond||n.cond()).length||1; const done=flow.slice(0,Math.max(idx,0)).filter(n=>!n.cond||n.cond()).length; document.getElementById('pb').style.width=Math.min(100,Math.round(done/vis*100))+'%'; }
function render(){
  box.innerHTML=''; const n=flow[idx]; cur=n.mount(box,pg); setProgress(); sendEvent(n.id+(n.pages&&n.pages()>1?'_p'+(pg+1):''));
  const er=$('div','err'); er.id='err'; box.appendChild(er);
  const nav=$('div','nav'); const b=$('button','next',cur.btn||'Next'); b.type='button'; b.onclick=next; nav.appendChild(b); box.appendChild(nav); window.scrollTo(0,0);
}
function next(){ const r=cur.collect(); const er=document.getElementById('err'); if(r.err){ er.textContent=r.err; return; } Object.assign(A,r.vals||{}); if(r.term){ finish('terminated',r.term); return; }
  const n=flow[idx]; if(pg+1<(n.pages?n.pages():1)){ pg++; render(); return; } advance(); }
function advance(){ do{ idx++; }while(idx<flow.length && flow[idx].cond && !flow[idx].cond()); if(idx>=flow.length){ finish('complete'); return; } pg=0; render(); }
function screen(h,p){ box.innerHTML=''; const d=$('div','center'); d.appendChild($('h1',null,h)); if(p) d.appendChild($('p',null,p)); box.appendChild(d); document.getElementById('pb').style.width='100%'; return d; }
let FIN=false;
async function finish(status,reason){
  if(FIN) return; FIN=true;
  screen('Please wait','Saving your responses...');
  const now=new Date(); const payload={ref:REF,country:COUNTRY,is_csuite:A.IS_CSUITE==null?null:A.IS_CSUITE===1,is_binf:A.IS_BINF==null?null:A.IS_BINF===1,status:status,term_reason:reason||null,started_at:(started||now).toISOString(),completed_at:now.toISOString(),duration_sec:Math.round((now-(started||now))/1000),answers:Object.assign({},A,{COUNTRY:PREVIEW?0:COUNTRY_CODES[CC],DEVICE_ID:DEVICE})};
  delete payload.answers.IS_CSUITE; delete payload.answers.IS_BINF; window.__PAYLOAD=payload;
  if(!PREVIEW){ let ok=false, dup=false; for(let t=0;t<3&&!ok&&!dup;t++){ try{ const r=await post('/rest/v1/responses',payload); if(r.ok) ok=true; else if(r.status===409) dup=true; }catch(e){} if(!ok&&!dup) await new Promise(r=>setTimeout(r,1200)); }
    if(dup){ lsSet(LOCKKEY,'1'); return screen('This link has already been used','Each survey link can only be used once.'); }
    if(!ok&&status==='terminated'){ return screen('Thank you for your time','At this time, you don\'t qualify for this particular survey. Thank you for your time.'); }
    if(!ok){ const d=screen('We could not save your responses','Please check your connection and try again.'); const b=$('button','next','Try again'); b.onclick=()=>{FIN=false;finish(status,reason);}; d.appendChild(b); return; }
    lsSet(LOCKKEY,'1'); }
  if(status==='complete') screen('Thank you','You have completed the survey. Your responses have been recorded.');
  else screen('Thank you for your time','At this time, you don\'t qualify for this particular survey. Thank you for your time.');
}
(async function init(){
  if(PREVIEW) document.getElementById('pvb').style.display='block';
  if(!M||!CC){ return screen('Invalid survey link','Please use the personal link you were sent.'); }
  if(!PREVIEW && await refUsed()) return screen('This link has already been used','Each survey link can only be used once.');
  flow=buildFlow(); idx=0; pg=0; render();
})();
</script>
